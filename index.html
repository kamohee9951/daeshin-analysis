                            </div>
                            <div className="h-[450px]">
                                <ResponsiveContainer width="100%" height="100%">

                                        <CartesianGrid strokeDasharray="3 3" vertical={false} stroke="#f1f5f9" />

                                        <Tooltip contentStyle={{borderRadius: '16px', border: 'none'}} />
                                        <Legend verticalAlign="top" align="right" iconType="circle" />
                                        <Line name="국어" dataKey="국어" stroke="#6366f1" strokeWidth={5} dot={{r: 6, fill: '#6366f1', strokeWidth: 3, stroke: '#fff'}} label={{position: 'top', dy:-15, fontSize:14, fontWeight:900, fill: '#4338ca', formatter:(v)=>`${v}%`}} />
                                        <Line name="수학" dataKey="수학" stroke="#10b981" strokeWidth={5} dot={{r: 6, fill: '#10b981', strokeWidth: 3, stroke: '#fff'}} label={{position: 'bottom', dy:25, fontSize:14, fontWeight:900, fill: '#064e3b', formatter:(v)=>`${v}%`}} />
                                        <Line name="영어" dataKey="영어" stroke="#f59e0b" strokeWidth={5} dot={{r: 6, fill: '#f59e0b', strokeWidth: 3, stroke: '#fff'}} label={{position: 'top', dy:-45, fontSize:14, fontWeight:900, fill: '#92400e', formatter:(v)=>`${v}%`}} />
                                    </LineChart>
                                </ResponsiveContainer>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-8 relative z-10 font-black">

                                        <p className="text-[10px] font-bold mb-10 text-indigo-100/60 font-black">{univ.desc}</p>
                                        <div className="space-y-4 font-black">
                                            <div className="bg-white/5 backdrop-blur-md p-5 rounded-3xl border border-white/10 flex justify-between items-center group-hover:bg-white/10 transition-colors shadow-inner">
                                                <div><span className="text-[10px] block uppercase tracking-widest text-indigo-200/80 mb-1 leading-none underline decoration-indigo-500/50 decoration-2 underline-offset-4 font-black">Tight (보수적)</span><p className="text-[9px] text-indigo-200/40 italic font-black">정시 안정 합격권</p></div>
                                                <div className="flex items-baseline gap-1 font-black"><span className="text-5xl tracking-tighter font-black">{univ.tight}</span><span className="text-sm opacity-60 font-bold ml-1 font-black">명</span></div>
                                            </div>
                                            <div className="bg-emerald-500/10 backdrop-blur-md p-5 rounded-3xl border border-emerald-400/20 flex justify-between items-center group-hover:bg-emerald-500/20 transition-colors shadow-inner font-black text-white">
                                                <div><span className="text-[10px] block uppercase tracking-widest text-emerald-300/80 mb-1 leading-none underline decoration-emerald-500/50 decoration-2 underline-offset-4 font-black font-black text-emerald-200">Flexible (유연)</span><p className="text-[9px] text-emerald-300/40 italic font-black">수시 도전/잠재</p></div>
                                                <div className="flex items-baseline gap-1 font-black"><span className="text-5xl text-emerald-200 font-black tracking-tighter">{univ.flex}</span><span className="text-sm opacity-60 text-emerald-200 font-bold ml-1 font-black">명</span></div>
                                            </div>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* 섹션 4: 전략 제언 (학년별 동적 Insight) */}
                        <section className="bg-indigo-950 rounded-[3rem] p-10 shadow-2xl relative overflow-hidden text-white font-black">
                            <div className="absolute top-0 right-0 p-12 opacity-5 pointer-events-none font-black"><Icon name="Target" size={400} /></div>
                            <div className="relative z-10 font-black">
                                <div className="flex items-center gap-5 mb-10 font-black font-black font-black">
                                    <Icon name="Award" size={48} className="text-amber-400" />
                                    <h3 className="text-3xl font-black tracking-widest uppercase italic underline decoration-amber-400 decoration-4 underline-offset-8">Strategic Insight ({currentData.label})</h3>
                                </div>
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-8 text-sm font-black text-indigo-50 leading-relaxed italic">
                                    <div className="bg-white/10 p-7 rounded-3xl border border-white/20 backdrop-blur-lg hover:bg-white/15 transition-all font-black">
                                        <div className="flex items-center gap-3 mb-4 font-black text-indigo-300"><Icon name="Book" size={20} /> Korean Strategy</div>

                                        <p>{currentData.advisory.math}</p>
                                    </div>
                                    <div className="bg-white/10 p-7 rounded-3xl border border-white/20 backdrop-blur-lg hover:bg-white/15 transition-all font-black font-black">
                                        <div className="flex items-center gap-3 mb-4 font-black text-amber-300"><Icon name="Zap" size={20} /> English Strategy</div>
                                        <p>{currentData.advisory.eng}</p>
                                    </div>
                                </div>
                            </div>
                        </section>
                    </main>

                    <footer className="mt-20 mb-10 text-center text-gray-500 text-[11px] font-bold tracking-[0.3em] uppercase opacity-60 italic font-black">
                        &copy; 2026 DAEJEON DAE SHIN HIGH SCHOOL · ACADEMIC INTELLIGENCE HUB · DATA CONSOLIDATED
                        <br />
                        <span className="mt-2 inline-block text-gray-400 underline decoration-indigo-200 underline-offset-4 uppercase tracking-[0.1em] font-black">Created by HA JIN SU</span>
                    </footer>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
